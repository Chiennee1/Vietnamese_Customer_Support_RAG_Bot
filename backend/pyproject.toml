[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vietnamese-customer-support-rag"
version = "1.0.0"
description = "Production-oriented Vietnamese customer support RAG backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.68,<3",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pypdf>=5.4,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "structlog>=25.1,<27",
  "tiktoken>=0.9,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
support-eval = "app.evaluation.runner:main"
support-provider-faithfulness = "app.evaluation.provider_faithfulness:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL/pgvector test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/schemas/auth.py" = ["S105"]
"app/db/seed.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
