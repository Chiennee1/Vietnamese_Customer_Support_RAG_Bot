services:
  db:
    image: pgvector/pgvector:pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_rag}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-support_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    command:
      - sh
      - -c
      - >-
        uv run --no-sync alembic upgrade head &&
        uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET: ${APP_SECRET:-local-development-secret}
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app:local-password@db:5432/support_rag}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-none}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-500}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-700}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-80}
      RAG_CANDIDATE_K: ${RAG_CANDIDATE_K:-20}
      RAG_FINAL_K: ${RAG_FINAL_K:-6}
      RAG_MINIMUM_SCORE: ${RAG_MINIMUM_SCORE:-0.015}
      RRF_RANK_CONSTANT: ${RRF_RANK_CONSTANT:-60}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  uploads:
