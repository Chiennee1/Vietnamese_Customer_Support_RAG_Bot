name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality, integration, and release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      APP_SECRET: ci-application-secret
      JWT_SECRET: ci-jwt-secret
      DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-password@127.0.0.1:5432/support_rag
      AGENT_DATABASE_URL: postgresql+asyncpg://app_agent:ci-agent-password@127.0.0.1:5432/support_rag
      MIGRATION_DATABASE_URL: postgresql+asyncpg://app:ci-password@127.0.0.1:5432/support_rag
      RUNTIME_DB_ROLE: app_runtime
      RUNTIME_DB_PASSWORD: ci-runtime-password
      AGENT_DB_ROLE: app_agent
      AGENT_DB_PASSWORD: ci-agent-password
      TEST_DATABASE_URL: postgresql+asyncpg://app_runtime:ci-runtime-password@127.0.0.1:5432/support_rag
      TEST_AGENT_DATABASE_URL: postgresql+asyncpg://app_agent:ci-agent-password@127.0.0.1:5432/support_rag
      OPENAI_API_KEY: ""
    services:
      postgres:
        image: pgvector/pgvector:pg16-bookworm
        env:
          POSTGRES_DB: support_rag
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d support_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Apply migrations and seed deterministic fixtures
        run: |
          uv run --no-sync alembic upgrade head
          uv run --no-sync python -m app.db.provision_runtime_role
          uv run --no-sync python -m app.db.seed

      - name: Lint and type-check
        run: |
          uv run --no-sync ruff check app tests ../scripts
          uv run --no-sync mypy app
          uv run --no-sync alembic check

      - name: Run unit and PostgreSQL integration tests
        run: uv run --no-sync pytest

      - name: Enforce RAG, agent, security, and citation gates
        run: uv run --no-sync support-eval --output ../evals/ci_report.json

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and build
        env:
          VITE_API_BASE_URL: https://api.example.test/api/v1
        run: |
          npm run lint
          npm run build

  containers:
    name: Production container builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build backend image
        run: docker build --tag support-rag-backend:ci backend

      - name: Build frontend image
        run: >-
          docker build
          --build-arg VITE_API_BASE_URL=https://api.example.test/api/v1
          --tag support-rag-frontend:ci
          frontend
